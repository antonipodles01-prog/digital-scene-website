<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Scene</title>
  <meta name="description" content="The Scene is a boutique talent agency operating within contemporary culture, representing fashion-first creators across lifestyle and creative industries.">
  <meta property="og:title" content="The Scene">
  <meta property="og:description" content="The Scene is a boutique talent agency operating within contemporary culture, representing fashion-first creators across lifestyle and creative industries.">
  <meta property="og:type" content="website">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'><rect fill='white' width='1' height='1'/></svg>">
  <link rel="preload" href="./Fonts/JetBrainsMono-2.304/DrukCond-Super.ttf" as="font" type="font/ttf">

  <style>
    @font-face {
      font-family: 'Druk Cond Super';
      src: url('./Fonts/JetBrainsMono-2.304/DrukCond-Super.ttf') format('truetype');
      font-weight: 900;
      font-display: block;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      /* position:fixed on body is the reliable Safari fix for fixed children
         breaking when overflow:hidden is set */
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Home ──────────────────────────────────────────────── */
    #home {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 0 36px;
      /* hidden until JS sets the correct font-size after font loads */
      visibility: hidden;
    }

    #home h1 {
      font-family: 'Druk Cond Super', sans-serif;
      font-weight: 900;
      line-height: 1;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0;
      white-space: nowrap;
      user-select: none;
      transform: translateY(0.02em);
    }

    /* ── Toggle button ─────────────────────────────────────── */
    #toggle {
      position: fixed;
      top: 28px;
      right: 36px;
      z-index: 400;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 88px;
      font-weight: 700;
      line-height: 1;
      color: #000;
      user-select: none;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
    }
    #toggle:active { transform: none; opacity: 1; }
    #toggle span {
      display: block;
      width: 1em;
      text-align: center;
      pointer-events: none;
    }

    /* ── Contact overlay ───────────────────────────────────── */
    #contact {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(32px, 4vw, 52px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    #contact.open {
      opacity: 1;
      pointer-events: auto;
    }

    .contact-body {
      font-size: clamp(20px, 2.6vw, 32px);
      line-height: 1.65;
      color: #000;
    }

    .contact-body p + p {
      margin-top: 1.65em;
    }

    .descriptor { max-width: 50%; }
    @media (max-width: 768px) { .descriptor { max-width: 100%; } }

    .contact-body a {
      color: #000;
      text-decoration: none;
    }
    .contact-body a:hover { opacity: 0.45; }

    #contact footer {
      position: absolute;
      bottom: clamp(32px, 4vw, 52px);
      left: clamp(32px, 4vw, 52px);
      font-size: 11px;
      color: #000;
      letter-spacing: 0.04em;
    }

    @media (prefers-reduced-motion: reduce) {
      #contact { transition: none; }
    }
  </style>
</head>
<body>

  <div id="home">
    <h1>THE SCENE</h1>
  </div>

  <button id="toggle" aria-label="Open contact"><span id="toggle-icon">+</span></button>

  <div id="contact" role="dialog" aria-modal="true" aria-label="Contact">
    <div class="contact-body">
      <p class="descriptor">The Scene is a boutique talent agency operating within contemporary culture, representing fashion-first creators across lifestyle and creative industries.</p>
      <p>224 Shoreditch High Street<br>London, United Kingdom E1 6PJ</p>
      <p>
        <a href="mailto:hello@thedigitalscene.com">hello@thedigitalscene.com</a><br>
        <a href="https://www.instagram.com/thescene.mgmt/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </p>
    </div>
    <footer>© The Scene 2026</footer>
  </div>

  <script>
    // Fit headline to fill exactly between the 36px margins
    function fitHeadline() {
      const h1 = document.querySelector('#home h1');
      const container = document.getElementById('home');
      h1.style.fontSize = '10px';
      const innerWidth = container.clientWidth - 72; // subtract 36px padding on each side
      const scale = innerWidth / h1.scrollWidth;
      h1.style.fontSize = (10 * scale) + 'px';
    }

    // Run after font is loaded so measurement is accurate
    document.fonts.ready.then(function () {
      fitHeadline();
      document.getElementById('home').style.visibility = 'visible';
    });

    window.addEventListener('resize', fitHeadline);

    // Toggle
    const toggle  = document.getElementById('toggle');
    const icon    = document.getElementById('toggle-icon');
    const contact = document.getElementById('contact');
    let isOpen = false;

    function setOpen(val) {
      isOpen = val;
      icon.textContent = isOpen ? '−' : '+';
      toggle.setAttribute('aria-label', isOpen ? 'Close contact' : 'Open contact');
      contact.classList.toggle('open', isOpen);
    }

    toggle.addEventListener('click', () => setOpen(!isOpen));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen) setOpen(false); });
  </script>

</body>
</html>
