<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Scene</title>
  <meta name="description" content="The Scene is a boutique talent agency operating within contemporary culture, representing fashion-first creators across lifestyle and creative industries.">
  <meta property="og:title" content="The Scene">
  <meta property="og:description" content="The Scene is a boutique talent agency operating within contemporary culture, representing fashion-first creators across lifestyle and creative industries.">
  <meta property="og:type" content="website">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'><rect fill='white' width='1' height='1'/></svg>">
  <link rel="preload" href="./Fonts/JetBrainsMono-2.304/DrukCond-Super.ttf" as="font" type="font/ttf">

  <style>
    @font-face {
      font-family: 'Druk Cond Super';
      src: url('./Fonts/JetBrainsMono-2.304/DrukCond-Super.ttf') format('truetype');
      font-weight: 900;
      font-display: block;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Home ──────────────────────────────────────────────── */
    #home {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 clamp(32px, 4vw, 52px);
      visibility: hidden;
    }

    #home h1 {
      font-family: 'Druk Cond Super', sans-serif;
      font-weight: 900;
      line-height: 1;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0;
      white-space: nowrap;
      user-select: none;
    }

    /* ── Toggle — lives inside #home, right: 0 flush with content edge ── */
    #toggle {
      position: absolute;
      top: clamp(20px, 3vw, 32px);
      right: 0;
      width: 88px;
      height: 88px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      z-index: 400;
    }
    #toggle:active, #toggle:focus { outline: none; }

    .t-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .t-icon svg {
      width: 32px;
      height: 32px;
      display: block;
    }

    /* ── Contact overlay ───────────────────────────────────── */
    #contact {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(32px, 4vw, 52px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    #contact.open {
      opacity: 1;
      pointer-events: auto;
    }

    .contact-body {
      font-size: clamp(20px, 2.6vw, 32px);
      line-height: 1.65;
      color: #000;
    }

    .contact-body p + p {
      margin-top: 1.65em;
    }

    .descriptor { max-width: 50%; }
    @media (max-width: 768px) { .descriptor { max-width: 100%; } }

    .contact-body a {
      color: #000;
      text-decoration: none;
    }
    .contact-body a:hover { opacity: 0.45; }

    #contact footer {
      position: absolute;
      bottom: clamp(32px, 4vw, 52px);
      left: clamp(32px, 4vw, 52px);
      font-size: 11px;
      color: #000;
      letter-spacing: 0.04em;
    }

    @media (prefers-reduced-motion: reduce) {
      #contact { transition: none; }
    }
  </style>
</head>
<body>

  <div id="home">
    <h1>THE SCENE</h1>

    <!-- Button shares #home as parent; right: 0 sits flush with content edge -->
    <div id="toggle" role="button" tabindex="0" aria-label="Open contact">
      <span class="t-icon" id="icon-plus">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect x="11" y="0" width="10" height="32"/>
          <rect x="0" y="11" width="32" height="10"/>
        </svg>
      </span>
      <span class="t-icon" id="icon-minus" style="display:none">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="11" width="32" height="10"/>
        </svg>
      </span>
    </div>
  </div>

  <div id="contact" role="dialog" aria-modal="true" aria-label="Contact">
    <div class="contact-body">
      <p class="descriptor">The Scene is a boutique talent agency operating within contemporary culture, representing fashion-first creators across lifestyle and creative industries.</p>
      <p>224 Shoreditch High Street<br>London, United Kingdom E1 6PJ</p>
      <p>
        <a href="mailto:hello@thedigitalscene.com">hello@thedigitalscene.com</a><br>
        <a href="https://www.instagram.com/thescene.mgmt/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </p>
    </div>
    <footer>© The Scene 2026</footer>
  </div>

  <script>
    function fitHeadline() {
      var h1 = document.querySelector('#home h1');
      var container = document.getElementById('home');
      h1.style.fontSize = '10px';
      var textWidth = h1.getBoundingClientRect().width;
      var style = window.getComputedStyle(container);
      var pad = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
      var innerWidth = container.getBoundingClientRect().width - pad;
      h1.style.fontSize = (10 * innerWidth / textWidth) + 'px';
    }

    document.fonts.ready.then(function () {
      fitHeadline();
      document.getElementById('home').style.visibility = 'visible';
    });

    window.addEventListener('resize', fitHeadline);

    var toggle   = document.getElementById('toggle');
    var iconPlus = document.getElementById('icon-plus');
    var iconMinus = document.getElementById('icon-minus');
    var contact  = document.getElementById('contact');
    var isOpen   = false;

    function setOpen(val) {
      isOpen = val;
      iconPlus.style.display  = isOpen ? 'none' : 'flex';
      iconMinus.style.display = isOpen ? 'flex' : 'none';
      toggle.setAttribute('aria-label', isOpen ? 'Close contact' : 'Open contact');
      contact.classList.toggle('open', isOpen);
    }

    toggle.addEventListener('click', function () { setOpen(!isOpen); });
    toggle.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpen(!isOpen); } });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && isOpen) setOpen(false); });
  </script>

</body>
</html>
