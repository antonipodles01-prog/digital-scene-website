<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Digital Scene — Influencer Marketing & Talent Management">
  <title>The Digital Scene</title>
  <link rel="preload" href="./Fonts/JetBrainsMono-2.304/DrukCond-Super.ttf" as="font" type="font/ttf" crossorigin="anonymous">

  <style>
    @font-face {
      font-family: 'Druk Cond Super';
      src: url('./Fonts/JetBrainsMono-2.304/DrukCond-Super.ttf') format('truetype');
      font-weight: 900;
      font-display: block;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #fff;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* ── Home ──────────────────────────────────────────────── */
    #home {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #home h1 {
      font-family: 'Druk Cond Super', sans-serif;
      font-weight: 900;
      font-size: clamp(140px, 36vw, 600px);
      line-height: 1;
      color: #000;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      user-select: none;
    }

    /* ── Toggle button ─────────────────────────────────────── */
    #toggle {
      position: fixed;
      top: 28px;
      right: 36px;
      z-index: 400;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 88px;
      font-weight: 700;
      line-height: 1;
      color: #000;
      user-select: none;
      padding: 0;
    }

    /* ── Contact overlay ───────────────────────────────────── */
    #contact {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(32px, 4vw, 52px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    #contact.open {
      opacity: 1;
      pointer-events: auto;
    }

    .contact-body {
      font-size: clamp(20px, 2.6vw, 32px);
      line-height: 1.65;
      color: #000;
    }

    .contact-body p + p {
      margin-top: 1.65em;
    }

    .descriptor { max-width: 50%; }
    @media (max-width: 768px) { .descriptor { max-width: 100%; } }

    .contact-body a {
      color: #000;
      text-decoration: none;
    }
    .contact-body a:hover { opacity: 0.45; }

    #contact footer {
      position: absolute;
      bottom: clamp(32px, 4vw, 52px);
      left: clamp(32px, 4vw, 52px);
      font-size: 11px;
      color: #000;
      letter-spacing: 0.04em;
    }

    @media (prefers-reduced-motion: reduce) {
      #contact { transition: none; }
    }
  </style>
</head>
<body>

  <div id="home">
    <h1>THE SCENE</h1>
  </div>

  <button id="toggle" aria-label="Open contact">+</button>

  <div id="contact" role="dialog" aria-modal="true" aria-label="Contact">
    <div class="contact-body">
      <p class="descriptor">The Scene is a boutique talent agency operating within contemporary culture, representing fashion-first creators across lifestyle and creative industries.</p>
      <p>224 Shoreditch High Street<br>London, United Kingdom E1 6PJ</p>
      <p>
        <a href="mailto:hello@thedigitalscene.com">hello@thedigitalscene.com</a><br>
        <a href="https://www.instagram.com/the.digital.scene/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </p>
    </div>
    <footer>© The Scene 2026</footer>
  </div>

  <script>
    const toggle = document.getElementById('toggle');
    const contact = document.getElementById('contact');
    let isOpen = false;

    function setOpen(val) {
      isOpen = val;
      toggle.textContent = isOpen ? '−' : '+';
      toggle.setAttribute('aria-label', isOpen ? 'Close contact' : 'Open contact');
      contact.classList.toggle('open', isOpen);
    }

    toggle.addEventListener('click', () => setOpen(!isOpen));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen) setOpen(false); });
  </script>

</body>
</html>
